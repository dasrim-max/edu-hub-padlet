# 모아보드 배포 (main 에 올라오면 실행, 수동 실행도 가능)
#  1) 학생용 서버 함수 moaboard-student: 포털 저장소의 공통 도우미(_shared)를 받아 함께 배포
#  2) 화면: 포털 사이트를 다시 빌드하게 알림(포털이 이 저장소의 site/ 를 /moaboard 로 합침)
# 필요한 GitHub 비밀 값(없는 단계는 건너뜀):
#   SUPABASE_ACCESS_TOKEN  Supabase 개인 접근 토큰
#   PORTAL_READ_TOKEN      포털 저장소(dasrim-max/edu-hub) 읽기 토큰
#   CF_PAGES_DEPLOY_HOOK   포털 사이트 다시 빌드 주소
# DB 변경(supabase/migrations)은 자동으로 적용하지 않아요. 개발 DB 에 직접 적용합니다(README).
name: deploy
on:
  push:
    branches: [main]
    paths: ["site/**", "supabase/functions/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PORTAL_READ_TOKEN: ${{ secrets.PORTAL_READ_TOKEN }}
      PROJECT_REF: tcgjldvplpdymdcsdray
    steps:
      - name: 비밀 값 확인
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PORTAL_READ_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN 또는 PORTAL_READ_TOKEN 이 없어 함수 배포를 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
        with:
          repository: dasrim-max/edu-hub
          token: ${{ secrets.PORTAL_READ_TOKEN }}
          path: .portal
          sparse-checkout: supabase/functions/_shared
      - name: 공통 도우미 가져오기
        if: steps.chk.outputs.skip != '1'
        run: cp -r .portal/supabase/functions/_shared supabase/functions/_shared
      - name: 순수 로직 시험
        if: steps.chk.outputs.skip != '1'
        run: node --experimental-strip-types --test supabase/functions/moaboard-student/logic.test.ts
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.skip != '1'
        with:
          version: latest
      - name: 함수 배포 (학생 세션은 코드 안에서 확인하므로 --no-verify-jwt)
        if: steps.chk.outputs.skip != '1'
        run: supabase functions deploy moaboard-student --project-ref "$PROJECT_REF" --no-verify-jwt
  site:
    runs-on: ubuntu-latest
    needs: functions
    steps:
      - name: 포털 사이트 다시 빌드
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_PAGES_DEPLOY_HOOK 이 없어 건너뜁니다."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "다시 빌드를 요청했어요."
